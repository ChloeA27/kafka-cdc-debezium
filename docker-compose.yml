version: '3.8'

services:
  # Kafka with KRaft (No Zookeeper needed!)
  kafka-debezium:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka-debezium
    container_name: kafka-debezium
    ports:
      - "29093:29092"  # External access
      - "9093:9093"    # Controller port
    environment:
      # KRaft mode configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-debezium:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-debezium:9092,PLAINTEXT_HOST://localhost:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      
      # Cluster ID (required for KRaft) - you can generate your own with kafka-storage random-uuid
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      
      # Topic configurations
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      
      # Log directory
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka_data_debezium:/var/lib/kafka/data
    networks:
      - kafka-network-debezium
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Schema Registry for Avro
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    hostname: schema-registry
    container_name: schema-registry-debezium
    depends_on:
      kafka-debezium:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka-debezium:9092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: '_schemas'
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: 'backward'
    networks:
      - kafka-network-debezium
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Kafka Connect with Debezium
  kafka-connect-debezium:
    image: debezium/connect:2.5
    container_name: kafka-connect-debezium
    depends_on:
      kafka-debezium:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      db-source-debezium:
        condition: service_started
      db-dest-debezium:
        condition: service_started
    ports:
      - "8084:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka-debezium:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      
      # Use JSON as default for Connect internal
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      
      # Schema Registry URL for Avro converters
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'
    networks:
      - kafka-network-debezium
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Source Database
  db-source-debezium:
    image: postgres:14.1-alpine
    container_name: db-source-debezium
    command: 
      - "postgres"
      - "-c"
      - "wal_level=logical"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5437:5432"
    volumes:
      - postgres_source_data_debezium:/var/lib/postgresql/data
    networks:
      - kafka-network-debezium
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Destination Database
  db-dest-debezium:
    image: postgres:14.1-alpine
    container_name: db-dest-debezium
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5438:5432"
    volumes:
      - postgres_dest_data_debezium:/var/lib/postgresql/data
    networks:
      - kafka-network-debezium
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_source_data_debezium:
  postgres_dest_data_debezium:
  kafka_data_debezium:

networks:
  kafka-network-debezium:
    driver: bridge
